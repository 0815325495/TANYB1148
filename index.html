<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treatment 2PS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    screens: {
                        'xs': '475px',
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- SheetJS (XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Chart.js & Datalabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <!-- Firebase SDKs (v9 modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        import { 
            getDatabase, ref, set, get, remove, update, onValue, serverTimestamp as rtdbServerTimestamp 
        } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        const rtdbConfig = {
          apiKey: "AIzaSyA6Ws7wHAjgjsCZcJmg7z_5_FQXgDcI4TI",
          authDomain: "nybtaoperation.firebaseapp.com",
          databaseURL: "https://nybtaoperation-default-rtdb.asia-southeast1.firebasedatabase.app/",
          projectId: "nybtaoperation",
          storageBucket: "nybtaoperation.firebasestorage.app",
          messagingSenderId: "382153747211",
          appId: "1:382153747211:web:217b1fd6e409b0fc27d00e",
          measurementId: "G-V6CQ4E4CKS"
        };
        
        let mainApp, rtdb, auth;
        try {
            mainApp = initializeApp(rtdbConfig);
            auth = getAuth(mainApp);
            rtdb = getDatabase(mainApp);
            console.log("Firebase Services Initialized");
        } catch (e) {
            console.error("Firebase Init Error:", e);
            document.getElementById('app-root').innerHTML = `<div class="p-4 text-red-600">Error: ${e.message}</div>`;
        }

        let loggedInUser = null, permissions = null, activeTab = 'operation', cars = [], isOnline = false;
        let dashboardChart = null; // Global variable for chart instance
        let isSeedingComplete = false; // Flag for login screen
        
        const navItems = [
            { id: 'operation', label: 'Operation', icon: 'Wrench', mobileLabel: 'Oper.' },
            { id: 'search', label: 'ค้นหาข้อมูล', icon: 'Search', mobileLabel: 'Search' },
            { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard', mobileLabel: 'Dash.' },
            { id: 'product', label: 'PRODUCT', icon: 'Database', mobileLabel: 'Prod.' },
            { id: 'sequence', label: 'Sequence', icon: 'Columns', mobileLabel: 'Seq.' },
            { id: 'admin', label: 'Admin', icon: 'UserCog', mobileLabel: 'Admin' },
        ];

        // *** DEFAULT SLOTS (Used as fallback or reset base) ***
        window.DEFAULT_PRODUCT_SLOTS = [
            { id: 'P0', t: '07:00-09:00', s: [7,0], e: [9,0], color: 'bg-gray-100' },
            { id: 'P1', t: '09:10-10:30', s: [9,10], e: [10,30], color: 'bg-purple-100' },
            { id: 'P2', t: '10:40-12:30', s: [10,40], e: [12,30], color: 'bg-sky-100' },
            { id: 'P3', t: '13:30-15:30', s: [13,30], e: [15,30], color: 'bg-green-100' },
            { id: 'P4', t: '15:40-18:00', s: [15,40], e: [18,0], color: 'bg-red-100' },
            { id: 'P5', t: '18:30-20:30', s: [18,30], e: [20,30], color: 'bg-orange-100' },
            { id: 'P6', t: '20:40-22:00', s: [20,40], e: [22,0], color: 'bg-yellow-100' }
        ];
        // *** ACTIVE SLOTS (Mutable, loaded per day) ***
        window.activeProductSlots = JSON.parse(JSON.stringify(window.DEFAULT_PRODUCT_SLOTS));
        
        // --- Excel Column Mappings (Used for Upload and Export) ---
        const EXCEL_HEADERS = [
            { key: 'vin', label: 'VIN' }, { key: 'priority', label: 'Priority' }, { key: 'model', label: 'Model' }, { key: 'color', label: 'Color' },
            { key: 'targetTreatmentDate', label: 'Target Treatment date' }, { key: 'treatmentDate', label: 'Treatment Date' },
            { key: 'responsibleTreatment', label: 'Responsible Treatment' }, { key: 'ngAlloyWheelFR', label: 'NG Alloy wheelFR' },
            { key: 'ngAlloyWheelFL', label: 'NG Alloy wheelFL' }, { key: 'ngAlloyWheelRR', label: 'NG Alloy wheelRR' },
            { key: 'ngAlloyWheelRL', label: 'NG Alloy wheelRL' }, { key: 'replaceAlloyWheelDate', label: 'Replace Alloy wheel Date' },
            { key: 'alloyWheelETADate', label: 'Alloy wheel ETA Date' }, { key: 'windshield', label: 'Windshield' },
            { key: 'rearPillow', label: 'Rear Pillow' }, { key: 'doorPanelFR', label: 'Door panelFR' },
            { key: 'doorPanelFL', label: 'Door panelFL' }, { key: 'doorPanelRR', label: 'Door panelRR' },
            { key: 'doorPanelRL', label: 'Door panelRL' }, { key: 'headLightLH', label: 'Head lightLH' },
            { key: 'headLightRH', label: 'Head lightRH' }, { key: 'logoF', label: 'LOGOF' },
            { key: 'logoR', label: 'LOGOR' }, { key: 'repairDateByREVER', label: 'Repair dateBy REVER' },
            { key: 'otherNG', label: 'Other NG' }, { key: 'otherHeavyNGFinal', label: 'Other HEAVY NGFinal' },
            // Add custom tracking fields
            { key: 'status', label: 'Status' }, 
            { key: 'interiorTimestamp', label: 'Interior Date' }, { key: 'interiorBy', label: 'Interior By' },
            { key: 'polishTimestamp', label: 'Polish Date' }, { key: 'polishBy', label: 'Polish By' }
        ];

        // *** Daily Report Headers for Export ***
        const DAILY_REPORT_HEADERS = [
            { key: 'vin', label: 'VIN' }, 
            { key: 'model', label: 'Model' }, 
            { key: 'color', label: 'Color' },
            { key: 'treatmentDate', label: 'วันที่ตามแผน (Treatment Date)' },
            { key: 'polishTimestamp', label: 'วันที่/เวลา ขัดสี (Actual)' }, 
            { key: 'interiorBy', label: 'ผู้บันทึกภายใน' },
            { key: 'polishBy', label: 'ผู้ตรวจสอบขัด' },
            { key: 'status', label: 'สถานะ' }
        ];

        // --- Helper Functions (Global) ---
        window.getJsDateFromExcel = (s) => {
             if (!s) return null;
             
             // 1. Handle Excel Serial Number (as number or string)
             const numericS = Number(s);
             if (!isNaN(numericS) && numericS > 25569 && numericS < 2958465) {
                 return new Date(Math.round((numericS - 25569) * 864e5));
             }
             
             // 2. Handle Text date formats
             if (typeof s === 'string' && s.trim() !== '') { 
                 const d = new Date(s); 
                 // Try parsing common formats (07-Nov-25, 11/7/2025)
                 if (!isNaN(d.getTime())) return d; 
             }
             return null;
        };

        window.formatExcelDate = (s) => {
            const d = window.getJsDateFromExcel(s);
            if (d) {
                 try {
                    return new Intl.DateTimeFormat('en-GB', {
                        day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC'
                    }).format(d).replace(/ /g, '-');
                } catch (e) { return s; }
            }
            return s || '-';
        };

        window.timestampToDatetimeLocal = (ts) => {
            if(!ts)return'';try{const d=new Date(ts);return(new Date(d.getTime()-d.getTimezoneOffset()*6e4)).toISOString().slice(0,16)}catch(e){return''}
        };
        
        // MODIFIED: Add new status
        window.getStatusClass = (s) => ({
            'checked':'bg-green-100 text-green-800',
            'waiting_final':'bg-blue-100 text-blue-800',
            'waiting_interior':'bg-pink-100 text-pink-800', // NEW
            'waiting_polish':'bg-yellow-100 text-yellow-800'
        }[s]||'bg-gray-100 text-gray-800');
        
        // MODIFIED: Add new status
        window.formatStatus = (s) => ({
            'checked':'ตรวจสอบแล้ว',
            'waiting_final':'รอ Final',
            'waiting_interior':'รอภายใน', // NEW
            'waiting_polish':'รอขัด'
        }[s]||'Remeaning');

        window.formatDateTime = (ts) => {
            if (!ts) return '-';
            try {
                return new Date(ts).toLocaleString('th-TH', { 
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' 
                });
            } catch (e) { return '-'; }
        };
        window.formatDateOnly = (dateString) => {
             if (!dateString) return '';
             try {
                 const d = new Date(dateString);
                 return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
             } catch (e) { return dateString; }
        };
        
        // *** Export Daily Report Function (Combines Plan & Actual for robust reporting) ***
        window.exportDailyReportToExcel = (data, monthStr) => {
            if (!data || data.length === 0) {
                window.renderModal("ไม่พบข้อมูลสำหรับการส่งออกในเดือนนี้", 'error');
                return;
            }

            try {
                const wb = XLSX.utils.book_new();
                const groupedByDay = {};

                data.forEach(item => {
                    // Priority 1: Group by Treatment Date (Plan)
                    let dateToGroup = window.getJsDateFromExcel(item.treatmentDate);
                    // Priority 2: Fallback to Polish Timestamp (Actual) if Plan is missing
                    if (!dateToGroup && item.polishTimestamp) {
                        dateToGroup = new Date(item.polishTimestamp);
                    }

                    if (dateToGroup) {
                        const dateStr = dateToGroup.toLocaleDateString('th-TH', { 
                            day: '2-digit', month: 'short', year: 'numeric' 
                        }).replace(/\s/g, '-');
                        
                        if (!groupedByDay[dateStr]) groupedByDay[dateStr] = [];
                        groupedByDay[dateStr].push(item);
                    }
                });
                
                const sortedDates = Object.keys(groupedByDay).sort((a, b) => {
                    const yearA = parseInt(a.substring(a.length - 4), 10);
                    const dayA = parseInt(a.substring(0, 2), 10);
                    const yearB = parseInt(b.substring(b.length - 4), 10);
                    const dayB = parseInt(b.substring(0, 2), 10);
                    if (yearA !== yearB) return yearA - yearB;
                    return dayA - dayB;
                });

                sortedDates.forEach(dateStr => {
                    const dayData = groupedByDay[dateStr];
                    dayData.sort((a, b) => (a.polishTimestamp || 0) - (b.polishTimestamp || 0));

                    const sheetData = dayData.map(item => {
                        const row = {};
                        DAILY_REPORT_HEADERS.forEach(h => {
                            let value = item[h.key];
                            if (h.key.toLowerCase().includes('timestamp') && value) {
                                value = window.formatDateTime(value);
                            } else if (h.key === 'treatmentDate') {
                                value = window.formatExcelDate(value);
                            } else if (h.key === 'status') {
                                value = window.formatStatus(value);
                            } else {
                                value = value || '-';
                            }
                            row[h.label] = value;
                        });
                        return row;
                    });

                    const ws = XLSX.utils.json_to_sheet(sheetData);
                    const sheetName = dateStr.length > 31 ? dateStr.substring(0, 31) : dateStr;
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                });

                XLSX.writeFile(wb, `Daily_Report_Production_${monthStr.replace('-', '_')}.xlsx`);
            } catch (e) {
                console.error("Export failed:", e);
                window.renderModal("การส่งออกล้มเหลว: " + e.message, 'error');
            }
        };
        
        // *** MODIFIED: Export Product Table Function with VIN Details ***
        window.exportProductTabToExcel = async (dateStr) => {
            if (!dateStr) { window.renderModal("กรุณาเลือกวันที่ก่อน Export", 'error'); return; }
            try {
                let dailyData = {};
                try { dailyData = (await get(ref(rtdb, `daily_targets/${dateStr}`))).val() || {}; } catch(e) {}
                
                // Use loaded slots or default if missing in daily data
                const slotsToUse = dailyData.slots || window.DEFAULT_PRODUCT_SLOTS;

                const start = new Date(dateStr + 'T00:00:00'), end = new Date(dateStr + 'T23:59:59');
                const counts = {}, vinsInSlots = {}; 
                slotsToUse.forEach(s => { counts[s.id] = 0; vinsInSlots[s.id] = []; });
                
                // MODIFIED LOGIC: Count if 'checked' OR 'waiting_final' OR 'waiting_interior' AND polishTimestamp is within the day
                cars.filter(c=>(c.status==='checked' || c.status==='waiting_final' || c.status==='waiting_interior')&&c.polishTimestamp&&new Date(c.polishTimestamp)>=start&&new Date(c.polishTimestamp)<=end)
                    .forEach(c=>{ 
                        const m = new Date(c.polishTimestamp).getHours()*60+new Date(c.polishTimestamp).getMinutes(); 
                        for(const s of slotsToUse) if(m>=s.s[0]*60+s.s[1]&&m<=s.e[0]*60+s.e[1]){ 
                            counts[s.id]++; 
                            vinsInSlots[s.id].push(c.vin); // Collect VINs for each slot
                            break; 
                        } 
                    });

                // 1. Create Summary Sheet Data
                const summaryData = [
                    { Metric: 'TARGET', ...slotsToUse.reduce((acc, s) => ({ ...acc, [s.id]: parseInt(dailyData[`target_${s.id}`]) || 0 }), {}) },
                    { Metric: 'ACTUAL', ...slotsToUse.reduce((acc, s) => ({ ...acc, [s.id]: counts[s.id] || 0 }), {}) },
                    { Metric: 'BALANCE', ...slotsToUse.reduce((acc, s) => ({ ...acc, [s.id]: (counts[s.id]||0) - (parseInt(dailyData[`target_${s.id}`])||0) }), {}) },
                    { Metric: '' } // Empty row spacer
                ];

                // 2. Add Detailed VIN List Section
                summaryData.push({ Metric: '--- รายละเอียด VIN ในแต่ละช่วงเวลา ---' });
                
                // Find max number of cars in any slot to determine rows needed
                const maxCarsInSlot = Math.max(0, ...Object.values(vinsInSlots).map(v => v.length)); // Use Math.max(0, ...)
                
                for (let i = 0; i < maxCarsInSlot; i++) {
                    const row = { Metric: `คันที่ ${i + 1}` };
                    slotsToUse.forEach(s => {
                        row[s.id] = vinsInSlots[s.id][i] || '';
                    });
                    summaryData.push(row);
                }

                const ws = XLSX.utils.json_to_sheet(summaryData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, `Product_${dateStr}`);
                XLSX.writeFile(wb, `Product_Treatment_${dateStr}.xlsx`);

            } catch (e) {
                console.error("Product Export Error:", e);
                window.renderModal("Export ล้มเหลว: " + e.message, 'error');
            }
        };

        window.handleSequenceExport = (statusId) => {
            const filteredCars = cars.filter(c => c.status === statusId);
            window.exportToExcel(filteredCars, `Sequence_Report_${statusId}`);
        };
        
        window.exportToExcel = (data, filename, headerMap = EXCEL_HEADERS) => {
            if (!data || data.length === 0) {
                window.renderModal("ไม่พบข้อมูลสำหรับการส่งออก", 'error');
                return;
            }
            try {
                const sheetData = data.map(item => {
                    const row = {};
                    headerMap.forEach(h => {
                        let value = item[h.key];
                        if (h.key.toLowerCase().includes('date')) {
                            value = window.formatExcelDate(value); 
                        } else if (h.key.toLowerCase().includes('timestamp') && value) {
                             value = window.formatDateTime(value);
                        }
                        row[h.label] = value || '';
                    });
                    return row;
                });

                const ws = XLSX.utils.json_to_sheet(sheetData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Report");
                XLSX.writeFile(wb, `${filename}_${new Date().toISOString().slice(0, 10)}.xlsx`);
            } catch (e) {
                console.error("Export failed:", e);
                window.renderModal("การส่งออกล้มเหลว: " + e.message, 'error');
            }
        };


        const appRoot = document.getElementById('app-root');
        
        const updateConnectionStatusUI = () => {
            const el = document.getElementById('connection-status'), icon = document.getElementById('connection-icon'), text = document.getElementById('connection-text');
            if (!el) return;
            if (isOnline) {
                text.textContent = 'ออนไลน์'; el.className = 'fixed top-2 right-2 z-50 px-2 py-1 rounded-full shadow-md flex items-center space-x-1 text-xs font-medium bg-green-100 text-green-800 transition-all duration-300'; icon.setAttribute('data-lucide', 'wifi');
            } else {
                text.textContent = 'ออฟไลน์'; el.className = 'fixed top-2 right-2 z-50 px-2 py-1 rounded-full shadow-md flex items-center space-x-1 text-xs font-medium bg-red-100 text-red-800 transition-all duration-300'; icon.setAttribute('data-lucide', 'wifi-off');
            }
            lucide.createIcons();
        };

        window.renderModal = (msg, type='success') => {
            document.getElementById('app-modal')?.remove();
            document.body.insertAdjacentHTML('beforeend', `
                <div id="app-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] px-4 animate-fade-in">
                    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full animate-scale-in">
                        <div class="flex items-center gap-3 mb-4 text-${type==='success'?'green':'red'}-600">
                            <i data-lucide="${type==='success'?'CheckCircle':'XCircle'}" class="w-6 h-6"></i>
                            <h3 class="font-semibold text-gray-900">${type==='success'?'สำเร็จ':'แจ้งเตือน'}</h3>
                        </div>
                        <p class="text-gray-600 mb-6">${msg}</p>
                        <button onclick="this.closest('#app-modal').remove()" class="w-full py-3 bg-gray-900 text-white rounded-xl font-medium">ตกลง</button>
                    </div>
                </div>
            `);
            lucide.createIcons();
            setTimeout(() => document.getElementById('app-modal')?.remove(), 3000);
        };

        window.renderConfirmationModal = (title, msg, onConfirm) => {
            document.getElementById('app-confirm-modal')?.remove();
            window._tempConfirmCallback = onConfirm;
            document.body.insertAdjacentHTML('beforeend', `
                <div id="app-confirm-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] px-4 animate-fade-in">
                    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full animate-scale-in">
                        <div class="flex items-start gap-4 mb-4">
                            <div class="p-2 bg-yellow-100 rounded-full shrink-0"><i data-lucide="AlertTriangle" class="w-6 h-6 text-yellow-600"></i></div>
                            <div><h3 class="font-semibold text-gray-900">${title}</h3><p class="text-sm text-gray-600 mt-1">${msg}</p></div>
                        </div>
                        <div class="flex gap-3 mt-6">
                            <button onclick="this.closest('#app-confirm-modal').remove()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium">ยกเลิก</button>
                            <button id="confirm-proceed-btn" class="flex-1 py-2.5 bg-gray-900 text-white rounded-xl font-medium">ยืนยัน</button>
                        </div>
                    </div>
                </div>
            `);
            lucide.createIcons();
            document.getElementById('confirm-proceed-btn').onclick = () => { 
                if (window._tempConfirmCallback) window._tempConfirmCallback(); 
                document.getElementById('app-confirm-modal')?.remove();
                delete window._tempConfirmCallback;
            };
        };
        
        const renderLoadingSpinner = (full=true) => full ? `<div class="flex justify-center items-center h-full"><i data-lucide="Loader2" class="w-10 h-10 text-blue-600 animate-spin"></i></div>` : `<i data-lucide="Loader2" class="w-5 h-5 animate-spin"></i>`;
        
        // --- AUTH & LOGIN Functions ---
        
        const renderLoginScreen = (error = null) => {
            const isRemembered = localStorage.getItem('treatment2ps_remember') === 'true';
            const savedUser = isRemembered ? (localStorage.getItem('treatment2ps_user') || '') : '';
            const savedPass = isRemembered ? (localStorage.getItem('treatment2ps_pass') || '') : '';

            const formContentHTML = isSeedingComplete ? `
                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                        <input id="username" name="username" type="text" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="" value="${savedUser}">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input id="password" name="password" type="password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="" value="${savedPass}">
                    </div>
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" ${isRemembered ? 'checked' : ''}>
                        <label for="remember-me" class="ml-2 block text-sm text-gray-900">จำฉันในระบบ</label>
                    </div>
                    ${error ? `<p class="text-sm text-center text-red-600">${error}</p>` : ''}
                    <button id="login-submit-btn" type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all">
                        เข้าสู่ระบบ
                    </button>
                </form>
            ` : `
                <div class="flex flex-col items-center">
                    <i data-lucide="Loader2" class="w-8 h-8 text-blue-500 animate-spin"></i>
                    <p class="mt-4 text-gray-600">กำลังเตรียมข้อมูลเริ่มต้น...</p>
                </div>
            `;
            
            appRoot.innerHTML = `
                <div class="flex items-center justify-center min-h-screen bg-gray-100 p-4">
                    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-2xl shadow-xl border border-gray-100">
                        <div class="flex flex-col items-center">
                            <i data-lucide="Car" class="w-12 h-12 text-blue-600"></i>
                            <h2 class="mt-4 text-2xl font-bold text-gray-900">Treatment 2PS Login</h2>
                        </div>
                        ${formContentHTML}
                    </div>
                </div>
            `;
            lucide.createIcons();
            
            if (isSeedingComplete) {
                document.getElementById('login-form')?.addEventListener('submit', handleLogin);
            }
        };

        const handleLogin = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            btn.disabled = true;
            btn.innerHTML = renderLoadingSpinner(false);
            lucide.createIcons();

            const username = e.target.username.value.toLowerCase();
            const password = e.target.password.value;
            
            try {
                const userRef = ref(rtdb, 'users/' + username);
                const userSnap = await get(userRef);

                if (!userSnap.exists()) {
                    renderLoginScreen("ไม่พบผู้ใช้งานนี้");
                    return;
                }

        // MODIFIED: Accept useLocalSlots flag to prevent overwriting edited data before saving
        window.renderProductTableAndTarget = async (useLocalSlots = false) => {

        window.updateDashboardChart = (monthStr) => {
            const ctx = document.getElementById('daily-report-chart')?.getContext('2d');
            if (!ctx || !monthStr) return;

            const [year, month] = monthStr.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();
            const labels = Array.from({length: daysInMonth}, (_, i) => i + 1);
            const mergedData = new Array(daysInMonth).fill(0);
            const exportData = [];
            const relevantVins = new Set();

            cars.forEach(car => {
                // MODIFIED LOGIC: Count if 'checked' OR 'waiting_final' OR 'waiting_interior'
                if (car.status === 'checked' || car.status === 'waiting_final' || car.status === 'waiting_interior') {
                     // Priority 1: Use Treatment Date (Plan) for X-axis
                     let dateToUse = window.getJsDateFromExcel(car.treatmentDate);
                     // Priority 2: Fallback to Polish Timestamp (Actual) if Plan is missing
                     if (!dateToUse && car.polishTimestamp) {
                          dateToUse = new Date(car.polishTimestamp);
                     }
                     
                     if (dateToUse && dateToUse.getMonth() === month - 1 && dateToUse.getFullYear() === year) {
                          mergedData[dateToUse.getDate() - 1] += 1;
                          if (!relevantVins.has(car.vin)) { exportData.push(car); relevantVins.add(car.vin); }
                     }
                }
            });
            
            const monthlyTotal = mergedData.reduce((sum, val) => sum + val, 0);
            const monthName = new Intl.DateTimeFormat('th-TH', { month: 'long' }).format(new Date(year, month - 1));
            if (document.getElementById('monthly-title')) document.getElementById('monthly-title').textContent = `ยอดเดือน ${monthName}`;

            c.innerHTML = `<div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6"><div class="flex flex-col md:flex-row md:items-center justify-between gap-4"><h2 class="text-2xl md:text-3xl font-bold text-gray-900">Operation</h2><div class="flex gap-3"><div class="px-4 py-2 bg-white rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3"><div class="p-1.5 bg-blue-100 rounded-lg"><i data-lucide="Armchair" class="w-4 h-4 text-blue-600"></i></div><div><p class="text-xs text-gray-500">ภายใน (ยอดวันที่เลือก)</p><p id="op-interior-count" class="text-lg font-bold text-gray-900">-</p></div></div><div class="px-4 py-2 bg-white rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3"><div class="p-1.5 bg-green-100 rounded-lg"><i data-lucide="Sparkles" class="w-4 h-4 text-green-600"></i></div><div><p class="text-xs text-gray-500">ขัดสี (ยอดวันที่เลือก)</p><p id="op-polish-count" class="text-lg font-bold text-gray-900">-</p></div></div></div></div><div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex items-center relative"><div class="pl-4 text-gray-400"><i data-lucide="Search" class="w-5 h-5"></i></div><input type="text" id="vin-search" class="flex-1 w-full min-w-0 py-4 px-3 bg-transparent focus:outline-none text-gray-900 relative z-20 appearance-none" placeholder="ค้นหา VIN..." enterkeyhint="search"><div class="p-1.5"><button id="vin-search-btn" class="p-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700"><i data-lucide="ArrowRight" class="w-5 h-5"></i></button></div></div><div id="operation-car-info"></div><div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-[calc(100vh-450px)] min-h-[300px]"><div class="p-4 md:p-6 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4"><h3 class="text-lg font-bold text-gray-900 flex items-center gap-2"><i data-lucide="History" class="w-5 h-5 text-gray-500"></i> รายการตรวจสอบล่าสุด</h3><input type="date" id="history-date-filter" value="${initialDate}" class="px-3 py-2 bg-gray-50 border-0 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"></div><div id="history-table-container" class="flex-1 overflow-auto"></div></div></div>`;
            
            // Initial call and event listener
            renderHistoryAndStats();
            document.getElementById('history-date-filter').onchange = renderHistoryAndStats;
            document.getElementById('vin-search-btn').onclick = window.handleOperationSearch;
            document.getElementById('vin-search').onkeypress = (e) => e.key==='Enter'&&window.handleOperationSearch();
        };

        window.renderSearchTab = (c) => {
            c.innerHTML = `<div class="max-w-3xl mx-auto p-4 md:p-6 space-y-6"><h2 class="text-2xl md:text-3xl font-bold text-gray-900">ค้นหาและแก้ไข</h2><div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex items-center sticky top-4 z-10 relative"><div class="pl-4 text-gray-400"><i data-lucide="Search" class="w-5 h-5"></i></div><input type="text" id="vin-search-edit" class="flex-1 w-full min-w-0 py-4 px-3 bg-transparent focus:outline-none text-gray-900 relative z-20 appearance-none" placeholder="ค้นหาเพื่อแก้ไข..." enterkeyhint="search"><div class="p-1.5"><button id="vin-search-edit-btn" class="p-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700"><i data-lucide="ArrowRight" class="w-5 h-5"></i></button></div></div><div id="search-car-info"></div></div>`;
            document.getElementById('vin-search-edit-btn').onclick = window.handleEditSearch;
            document.getElementById('vin-search-edit').onkeypress = (e) => e.key==='Enter'&&window.handleEditSearch();
        };

        window.renderDashboardTab = (c) => {
            const total = cars.length;
            
            // MODIFIED: เสร็จสิ้น (รวม) = waiting_final + checked + waiting_interior (anything polished)
            const finishedTotal = cars.filter(c => ['waiting_final', 'checked', 'waiting_interior'].includes(c.status)).length;
            // MODIFIED: คงเหลือ = remaining + waiting_polish (anything not polished)
            const remainingTotal = cars.filter(c => ['remaining', 'waiting_polish'].includes(c.status)).length;

            const now = new Date(), currentMonthIso = now.toISOString().slice(0, 7), todayIso = now.toISOString().split('T')[0];
            c.innerHTML = `<div class="max-w-6xl mx-auto p-4 md:p-6 space-y-6"><h2 class="text-2xl md:text-3xl font-bold text-gray-900">Dashboard</h2><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6"><div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100"><div class="flex justify-between mb-4"><h3 class="text-sm font-medium text-gray-500">ทั้งหมด</h3><div class="p-2 bg-blue-50 rounded-xl"><i data-lucide="Car" class="w-5 h-5 text-blue-500"></i></div></div><p class="text-3xl font-bold text-gray-900">${total}</p></div><div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100"><div class="flex justify-between mb-4"><h3 class="text-sm font-medium text-gray-500">เสร็จสิ้น (รวม)</h3><div class="p-2 bg-green-50 rounded-xl"><i data-lucide="CheckCircle2" class="w-5 h-5 text-green-500"></i></div></div><p class="text-3xl font-bold text-gray-900">${finishedTotal}</p></div><div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100"><div class="flex justify-between mb-4"><h3 class="text-sm font-medium text-gray-500">คงเหลือ</h3><div class="p-2 bg-yellow-50 rounded-xl"><i data-lucide="Clock" class="w-5 h-5 text-yellow-500"></i></div></div><p class="text-3xl font-bold text-gray-900">${remainingTotal}</p></div><div class="bg-white p-6 rounded-3xl shadow-sm border border-purple-100 bg-purple-50/50"><div class="flex justify-between mb-4"><h3 id="monthly-title" class="text-sm font-medium text-gray-500">ยอดเดือน...</h3><div class="p-2 bg-purple-100 rounded-xl"><i data-lucide="CalendarDays" class="w-5 h-5 text-purple-600"></i></div></div><p id="monthly-total" class="text-3xl font-bold text-purple-900">-</p></div></div><div class="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-gray-100"><div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6"><h3 class="text-lg font-bold text-gray-900 flex items-center gap-2"><i data-lucide="BarChart3" class="w-5 h-5 text-blue-500"></i> รายงานประจำวัน</h3><div class="flex items-center gap-2"><label for="dashboard-month" class="text-sm font-medium text-gray-600">เลือกเดือน:</label><input type="month" id="dashboard-month" value="${currentMonthIso}" class="px-3 py-2 bg-gray-50 border-0 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"><button id="dashboard-export-btn" class="flex items-center gap-2 px-3 py-2 bg-gray-900 text-white rounded-xl shadow hover:bg-gray-800 transition-all text-sm disabled:opacity-50" disabled><i data-lucide="FileText" class="w-4 h-4"></i> Export (รายวัน)</button></div></div><div class="relative h-[300px] md:h-[400px] w-full"><canvas id="daily-report-chart"></canvas></div></div><div class="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-gray-100"><div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6"><h3 class="text-lg font-bold text-gray-900 flex items-center gap-2"><i data-lucide="Users" class="w-5 h-5 text-purple-500"></i> สรุปผลการปฏิบัติงานรายบุคคล</h3><div class="flex items-center gap-2"><label for="productivity-date" class="text-sm font-medium text-gray-600">เลือกวันที่:</label><input type="date" id="productivity-date" value="${todayIso}" class="px-3 py-2 bg-gray-50 border-0 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"></div></div><div id="checker-productivity-container"></div></div></div>`;
            const monthInput = document.getElementById('dashboard-month'); if (monthInput) { monthInput.addEventListener('change', () => window.updateDashboardChart(monthInput.value)); window.updateDashboardChart(currentMonthIso); }
            const dateInput = document.getElementById('productivity-date'); if (dateInput) { dateInput.addEventListener('change', () => window.renderCheckerProductivity(dateInput.value)); window.renderCheckerProductivity(todayIso); }
        };

        window.renderProductTab = (c) => {
            const now = new Date();
            const today = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            c.innerHTML = `<div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6"><div class="flex flex-col md:flex-row md:items-center justify-between gap-4"><h2 class="text-2xl md:text-3xl font-bold text-gray-900">Product Treatment</h2><div class="flex items-center gap-3 w-full md:w-auto"><input type="date" id="product-date" value="${today}" class="px-4 py-2.5 bg-white border-0 rounded-xl shadow-sm font-medium focus:ring-2 focus:ring-blue-500 flex-1 md:flex-none"><button onclick="window.renderEditSlotsModal()" class="p-2.5 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200 transition-all"><i data-lucide="Clock" class="w-5 h-5"></i></button><button id="product-export-btn" class="flex items-center gap-2 px-4 py-2.5 bg-gray-900 text-white rounded-xl shadow hover:bg-gray-800 transition-all text-sm whitespace-nowrap"><i data-lucide="FileText" class="w-4 h-4"></i> Export (ตาราง)</button></div></div><div class="grid grid-cols-3 gap-3 md:gap-6"><div class="p-4 md:p-6 bg-blue-600 rounded-3xl shadow-lg shadow-blue-200 text-white"><p class="text-blue-100 text-xs md:text-sm font-medium mb-1">Total Target</p><p id="total-target-display" class="text-2xl md:text-4xl font-bold">0</p></div><div class="p-4 md:p-6 bg-green-600 rounded-3xl shadow-lg shadow-green-200 text-white"><p class="text-green-100 text-xs md:text-sm font-medium mb-1">Total Actual</p><p id="total-display" class="text-2xl md:text-4xl font-bold">0</p></div><div class="p-4 md:p-6 bg-yellow-500 rounded-3xl shadow-lg shadow-yellow-200 text-white"><p class="text-yellow-50 text-xs md:text-sm font-medium mb-1">Remeaning</p><p id="remeaning-display" class="text-2xl md:text-4xl font-bold">0</p></div></div><div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden"><div class="overflow-x-auto" id="product-table-container">${renderLoadingSpinner(false)}</div></div><div class="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-gray-100 space-y-3"><h3 class="font-semibold text-gray-900 flex items-center gap-2"><i data-lucide="StickyNote" class="w-5 h-5 text-gray-400"></i> หมายเหตุ</h3><textarea id="product-notes" rows="8" class="w-full p-3 bg-gray-50 border-0 rounded-xl resize-none focus:ring-2 focus:ring-blue-500" placeholder="บันทึกเพิ่มเติม..."></textarea></div><button id="save-slot-targets-btn" class="w-full md:w-auto md:float-right flex items-center justify-center gap-2 px-8 py-4 bg-gray-900 text-white rounded-2xl font-medium hover:bg-gray-800 transition-all active:scale-95"><i data-lucide="Save" class="w-5 h-5"></i><span>บันทึกข้อมูล</span></button></div>`;
            const dateInput = document.getElementById('product-date');
            dateInput.onchange = window.renderProductTableAndTarget;
            document.getElementById('save-slot-targets-btn').onclick = window.handleSaveSlotTargets;
            document.getElementById('product-export-btn').onclick = () => window.exportProductTabToExcel(dateInput.value);
            (async () => { try { const snap = await get(ref(rtdb, `daily_targets/${today}`)); if(snap.exists()) { document.getElementById('product-notes').value = snap.val().notes || ''; } } catch(e) {} await window.renderProductTableAndTarget(); })();
        };

        // MODIFIED: Add new column and logic
        window.renderSequenceTab = (c) => {
            const cols = [ 
                { id: 'remaining', title: 'Remeaning', bg: 'bg-gray-100', text: 'text-gray-900', border: 'border-gray-200' }, 
                { id: 'waiting_polish', title: 'รอขัด', bg: 'bg-yellow-50', text: 'text-yellow-900', border: 'border-yellow-100' }, 
                { id: 'waiting_interior', title: 'รอ ภายใน', bg: 'bg-pink-100', text: 'text-pink-900', border: 'border-pink-100' }, // NEW COLUMN
                { id: 'waiting_final', title: 'รอ Final', bg: 'bg-blue-50', text: 'text-blue-900', border: 'border-blue-100' }, 
                { id: 'checked', title: 'ตรวจสอบแล้ว', bg: 'bg-green-50', text: 'text-green-900', border: 'border-green-100' } 
            ];
            c.innerHTML = `<div class="h-full flex flex-col p-2 md:p-6 overflow-hidden"><h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-4 px-2 md:px-0 shrink-0">Sequence</h2><div class="flex-1 grid grid-cols-1 md:grid-cols-5 gap-4 min-h-0 overflow-x-auto md:overflow-visible snap-x snap-mandatory md:snap-none">${cols.map(col => { 
                let list = cars.filter(c => c.status === col.id);
                // Sort logic based on new workflow
                if (col.id === 'waiting_polish') {
                     list.sort((a, b) => (b.interiorTimestamp || 0) - (a.interiorTimestamp || 0)); // Sort by Interior date
                } else if (col.id === 'waiting_interior') {
                     list.sort((a, b) => (b.polishTimestamp || 0) - (a.polishTimestamp || 0)); // Sort by Polish date
                } else if (col.id === 'waiting_final' || col.id === 'checked') {
                     list.sort((a, b) => (b.polishTimestamp || 0) - (a.polishTimestamp || 0)); // Sort by Polish date
                }
                
                return `<div class="flex flex-col h-full max-h-full rounded-2xl md:rounded-3xl border ${col.border} ${col.bg} overflow-hidden snap-center min-w-[85vw] md:min-w-0"><div class="p-4 font-bold ${col.text} flex justify-between items-center shrink-0 border-b ${col.border} bg-white/50 backdrop-blur sticky top-0 z-10">${col.title} <span class="bg-white px-2.5 py-0.5 rounded-full text-sm shadow-sm">${list.length}</span><button onclick="window.handleSequenceExport('${col.id}')" class="p-1.5 bg-gray-700 text-white rounded-xl hover:bg-gray-800 transition-all"><i data-lucide="FileText" class="w-4 h-4"></i></button></div><div class="p-2 md:p-3 space-y-2 overflow-y-auto flex-1 overscroll-contain">${list.length ? list.map(car => { let timeInfo = ''; if (car.polishTimestamp) { timeInfo += `<p class="text-xs text-gray-500 mt-2 flex items-center gap-1"><i data-lucide="Sparkles" class="w-3 h-3 text-green-500"></i>ขัดสี: ${formatDateTime(car.polishTimestamp)}</p>`; if (car.polishBy) timeInfo += `<p class="text-xs text-gray-500 mt-1 pl-4 flex items-center gap-1">(${car.polishBy})</p>`; } else if (car.interiorTimestamp) { timeInfo += `<p class="text-xs text-gray-500 mt-2 flex items-center gap-1"><i data-lucide="Armchair" class="w-3 h-3 text-blue-500"></i>ภายใน: ${formatDateTime(car.interiorTimestamp)}</p>`; if (car.interiorBy) timeInfo += `<p class="text-xs text-gray-500 mt-1 pl-4 flex items-center gap-1">(${car.interiorBy})</p>`; } return `<div class="bg-white p-3 md:p-4 rounded-xl md:rounded-2xl shadow-sm border border-gray-100 relative group"><div class="pr-6"><div class="font-bold text-gray-900 truncate">${car.vin}</div><div class="text-xs text-gray-500 mt-1 flex items-center gap-2"><span class="truncate max-w-[100px]">${car.model}</span><span class="w-1 h-1 bg-gray-300 rounded-full"></span><span class="truncate">${car.color}</span></div><div class="inline-block mt-2 px-2 py-0.5 bg-gray-100 text-gray-600 text-[10px] font-medium rounded-md">P: ${car.priority||'-'}</div>${timeInfo}</div>
                    ${car.status==='waiting_polish'?`<button onclick="renderConfirmationModal('ยกเลิกการรอขัด','ย้ายกลับไป Remeaning (ลบข้อมูลภายใน)?',()=>handleCancelPolish('${car.vin}'))" class="absolute top-2 right-2 p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full"><i data-lucide="X" class="w-4 h-4"></i></button>`:''}
                    ${car.status==='waiting_interior'?`<button onclick="renderConfirmationModal('ยกเลิกการรอภายใน','ย้ายกลับไป Remeaning (ลบข้อมูลขัดสี)?',()=>handleCancelInterior('${car.vin}'))" class="absolute top-2 right-2 p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full"><i data-lucide="X" class="w-4 h-4"></i></button>`:''}
                    ${car.status==='waiting_final'?`<button onclick="renderConfirmationModal('ยกเลิกรอ Final','ย้ายกลับไปรอขัด (ลบข้อมูลขัดสี)?',()=>handleCancelFinal('${car.vin}'))" class="absolute top-2 right-2 p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full"><i data-lucide="X" class="w-4 h-4"></i></button>${permissions?.admin?`<button onclick="handleConfirmFinal('${car.vin}')" class="mt-3 w-full py-2 bg-green-600 text-white text-sm font-medium rounded-xl hover:bg-green-700 flex items-center justify-center gap-1"><i data-lucide="CheckCircle2" class="w-4 h-4"></i> Confirm</button>`:''}`:''}
                    ${car.status==='checked'?`<button onclick="renderConfirmationModal('ยกเลิกตรวจสอบ','ย้ายกลับไปรอ Final?',()=>handleCancelChecked('${car.vin}'))" class="absolute top-2 right-2 p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full"><i data-lucide="X" class="w-4 h-4"></i></button>`:''}
                </div>`}).join('') : `<div class="h-full flex items-center justify-center text-sm text-gray-400 italic pb-20">ว่าง</div>`}</div></div>`}).join('')}</div></div>`;
        };

        const renderContent = () => {
            const el = document.getElementById('app-content'); if(!el)return;
            const map = { 'operation': window.renderOperationTab, 'search': window.renderSearchTab, 'dashboard': window.renderDashboardTab, 'product': window.renderProductTab, 'sequence': window.renderSequenceTab, 'admin': window.renderAdminTab };
            (map[activeTab] || window.renderOperationTab)(el); lucide.createIcons();
        };

        const parseExcelToJSON = (file) => {
            return new Promise((resolve, reject) => {
                if (typeof XLSX === 'undefined') { reject(new Error("XLSX library is not loaded.")); return; }
                const reader = new FileReader();
                reader.onload = (e) => { const data = e.target.result; const workbook = XLSX.read(data, { type: 'binary' }); const sheetNames = workbook.SheetNames; if (!sheetNames || sheetNames.length === 0) return reject(new Error("ไม่พบชีต (Sheet) ในไฟล์ Excel ที่อัปโหลด")); const sheetName = sheetNames[0]; const worksheet = workbook.Sheets[sheetName]; const json = XLSX.utils.sheet_to_json(worksheet); resolve(json); };
                reader.onerror = (ex) => reject(ex); reader.readAsBinaryString(file);
            });
        };
        
        let carDataUnsubscribe = null;
        const setupCarDataListener = () => {
            if (carDataUnsubscribe) carDataUnsubscribe();
            carDataUnsubscribe = onValue(ref(rtdb, 'treatment_cars'), s => { 
                cars = s.exists() ? Object.values(s.val()) : []; 
                cars.sort((a,b)=>String(a.priority||'').localeCompare(String(b.priority||''),undefined,{numeric:true})); 
                renderContent(); 
                if (activeTab === 'dashboard') { const monthInput = document.getElementById('dashboard-month'); if (monthInput) window.updateDashboardChart(monthInput.value); }
            });
        };
        
        const setupConnectionListener = () => { onValue(ref(rtdb, '.info/connected'), s => { isOnline = s.val(); updateConnectionStatusUI(); }); };
        const seedDatabase = async () => { try { const rolesRef = ref(rtdb, 'roles'); const rolesSnap = await get(rolesRef); if (!rolesSnap.exists()) { await set(rolesRef, { admin: { operation: true, search: true, dashboard: true, product: true, sequence: true, admin: true }, operation: { operation: true, search: true, dashboard: true, product: false, sequence: true, admin: false }, SJWD: { operation: false, search: true, dashboard: true, product: true, sequence: true, admin: false } }); } const usersRef = ref(rtdb, 'users/admin'); const usersSnap = await get(usersRef); if (!usersSnap.exists()) { await set(usersRef, { password: '123', role: 'admin' }); } } catch (err) { console.error("Database seeding error:", err); renderModal("Error preparing initial data. Please check Firebase rules.", 'error'); } };
        const startApp = async () => { renderLoginScreen(); if (rtdb) { setupConnectionListener(); await seedDatabase(); isSeedingComplete = true; renderLoginScreen(); } };
        startApp();
    </script>
</head>
